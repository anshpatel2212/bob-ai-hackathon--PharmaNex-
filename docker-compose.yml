services:
  # PostgreSQL 16 Relational Database
  db:
    image: postgres:16-alpine
    container_name: pharmaguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmaguard
      POSTGRES_PASSWORD: pharmaguard_secret
      POSTGRES_DB: pharmaguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaguard -d pharmaguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Python Backend Service
  backend:
    container_name: pharmaguard-ai-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pharmaguard:pharmaguard_secret@db:5432/pharmaguard_db
      JWT_SECRET: super_secret_pharmaguard_jwt_key_change_in_production_987654321
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
    depends_on:
      db:
        condition: service_healthy

  # Production Single Page Application (Served by Nginx Alpine)
  app:
    container_name: pharmaguard-ai-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Development Container with Hot Module Replacement (Optional)
  dev:
    container_name: pharmaguard-ai-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev

volumes:
  pgdata:
