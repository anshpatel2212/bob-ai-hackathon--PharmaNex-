server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;


    # ==========================================================
    # GZIP
    # ==========================================================

    gzip on;

    gzip_vary on;

    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;


    # ==========================================================
    # SECURITY HEADERS
    # ==========================================================

    add_header
        X-Frame-Options
        "SAMEORIGIN"
        always;

    add_header
        X-Content-Type-Options
        "nosniff"
        always;

    add_header
        Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    add_header
        X-XSS-Protection
        "1; mode=block"
        always;


    # ==========================================================
    # HEALTH CHECK
    # ==========================================================

    location = /health {

        access_log off;

        default_type text/plain;

        return 200 "healthy\n";
    }


    # ==========================================================
    # STATIC ASSETS
    # ==========================================================

    location /assets/ {

        expires 1y;

        add_header
            Cache-Control
            "public, max-age=31536000, immutable";

        access_log off;
    }


    # ==========================================================
    # INDEX
    # ==========================================================

    location = /index.html {

        expires -1;

        add_header
            Cache-Control
            "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }


    # ==========================================================
    # REACT SPA
    # ==========================================================

    location / {

        try_files
            $uri
            $uri/
            /index.html;
    }
}