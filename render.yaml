# ==============================================================================
# PharmaGuard AI — Render Blueprint Specification
# ==============================================================================
databases:
  - name: pharmaguard-db
    databaseName: pharmaguard_db
    user: pharmaguard
    plan: free

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: pharmaguard-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_URL
        value: "https://bob-ai-hackathon-pharmanex.onrender.com"

  # ----------------------------------------------------------------------------
  # 2. React SPA Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: pharmaguard-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://pharmaguard-backend.onrender.com"
        # IMPORTANT: Override this in the Render dashboard if your backend URL differs.
        # Find the exact URL in Render → pharmaguard-backend → Settings → URL
        # Do NOT append /api — api.ts already appends it.
